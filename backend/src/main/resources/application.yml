spring:
  profiles:
    active: default

  datasource:
    url: jdbc:postgresql://localhost:5432/dro_db
    username: postgres
    password: arisco2017
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://dro_mongo:dro_mongo_pass@localhost:27017/dro_audit?authSource=admin}
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}
server:
  port: 8080

logging:
  level:
    org.springframework.jdbc: DEBUG

dro:
  security:
    jwt:
      secret: ${DRO_JWT_SECRET:dro-local-development-secret-change-this-before-production-2026}
      issuer: ${DRO_JWT_ISSUER:digimon-revolution-online}
      expiration-minutes: ${DRO_JWT_EXPIRATION_MINUTES:1440}

