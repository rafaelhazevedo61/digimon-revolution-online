spring:
  application:
    name: digimon-revolution-online

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.jdbc: INFO

dro:
  registration:
    invite-required: ${DRO_REGISTRATION_INVITE_REQUIRED:false}

  audit:
    outbox:
      fixed-delay-ms: ${DRO_AUDIT_OUTBOX_FIXED_DELAY_MS:5000}
      max-attempts: ${DRO_AUDIT_OUTBOX_MAX_ATTEMPTS:5}

  cache:
    catalogs:
      maximum-size: ${DRO_CACHE_CATALOGS_MAX_SIZE:500}
      ttl-seconds: ${DRO_CACHE_CATALOGS_TTL_SECONDS:300}

  security:
    jwt:
      issuer: ${DRO_JWT_ISSUER:digimon-revolution-online}
      expiration-minutes: ${DRO_JWT_EXPIRATION_MINUTES:1440}

  dro:
    bootstrap-admin:
      enabled: ${DRO_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${DRO_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${DRO_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${DRO_BOOTSTRAP_ADMIN_PASSWORD:}