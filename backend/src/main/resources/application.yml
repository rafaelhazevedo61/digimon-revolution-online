spring:
  application:
    name: digimon-revolution-online

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.jdbc: INFO

dro:
  digitama:
    # Controle temporário dos Digimons BABY elegíveis nos pools de Digitama.
    # A origem será migrada futuramente para available_contents.
    baby-digimons:
      Algomon Baby I: true
      Bombmon: true
      Bommon: true
      Botamon: true
      Bubbmon: true
      Chibickmon: true
      Chicomon: true
      Choromon: true
      Cocomon: true
      Cotsucomon: true
      Curimon: true
      Dodomon: true
      Dokimon: true
      Fufumon: true
      Fukamon: true
      Fusamon: true
      Jyarimon: true
      Keemon: true
      Kekomon: true
      Ketomon: true
      Kuramon: true
      Leafmon: true
      Mokumon: true
      Nyokimon: true
      Pabumon: true
      Paomon: true
      Pafumon: true
      Peti Meramon: true
      Petitmon: true
      Pichimon: true
      Pipimon: true
      Pitchmon: true
      Popomon: true
      Poyomon: true
      Punimon: true
      Pupumon: true
      Pururumon: true
      Pusumon: true
      Puttimon: true
      Puwamon: true
      Puyomon: true
      Pyonmon: true
      Relemon: true
      Sakumon: true
      Sunamon: true
      Tomorimon: true
      Torikara Ballmon: true
      Tsubumon: true
      Yolkmon: true
      Yukimi Botamon: true
      Yuramon: true
      Zerimon: true
      Zurumon: true

  gameplay:
    auto-boss-respawn-after-defeat-enabled: false
    boss-cooldown-enabled: ${DRO_BOSS_COOLDOWN_ENABLED:true}

    clan-raid:
      cooldown-enabled: ${DRO_CLAN_RAID_COOLDOWN_ENABLED:true}

    energy:
      consumption-enabled: ${DRO_ENERGY_CONSUMPTION_ENABLED:true}

    arena:
      daily-challenge-limit: ${DRO_ARENA_DAILY_CHALLENGE_LIMIT:5}

    world-boss:
      cooldown-enabled: ${DRO_WORLD_BOSS_COOLDOWN_ENABLED:true}

  registration:
    invite-required: ${DRO_REGISTRATION_INVITE_REQUIRED:false}

  audit:
    outbox:
      fixed-delay-ms: ${DRO_AUDIT_OUTBOX_FIXED_DELAY_MS:5000}
      max-attempts: ${DRO_AUDIT_OUTBOX_MAX_ATTEMPTS:5}

  cache:
    catalogs:
      maximum-size: ${DRO_CACHE_CATALOGS_MAX_SIZE:500}
      ttl-seconds: ${DRO_CACHE_CATALOGS_TTL_SECONDS:300}

  security:
    jwt:
      issuer: ${DRO_JWT_ISSUER:digimon-revolution-online}
      expiration-minutes: ${DRO_JWT_EXPIRATION_MINUTES:1440}

  dro:
    bootstrap-admin:
      enabled: ${DRO_BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${DRO_BOOTSTRAP_ADMIN_USERNAME:}
      email: ${DRO_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${DRO_BOOTSTRAP_ADMIN_PASSWORD:}