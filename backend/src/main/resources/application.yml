spring:
  profiles:
    active: default

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dro_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:arisco2017}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://dro_mongo:change-this-mongo-password@localhost:27017/dro_audit?authSource=admin}
  data:
    mongodb:
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.jdbc: DEBUG

dro:
  audit:
    outbox:
      fixed-delay-ms: ${DRO_AUDIT_OUTBOX_FIXED_DELAY_MS:5000}
      max-attempts: ${DRO_AUDIT_OUTBOX_MAX_ATTEMPTS:5}
  cache:
    catalogs:
      maximum-size: ${DRO_CACHE_CATALOGS_MAX_SIZE:500}
      ttl-seconds: ${DRO_CACHE_CATALOGS_TTL_SECONDS:300}
  security:
    jwt:
      secret: ${DRO_JWT_SECRET:dro-local-development-secret-change-this-before-production-2026}
      issuer: ${DRO_JWT_ISSUER:digimon-revolution-online}
      expiration-minutes: ${DRO_JWT_EXPIRATION_MINUTES:1440}

