services:
  dro-postgres:
    image: postgres:16
    container_name: dro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dro_db}
      POSTGRES_USER: ${POSTGRES_USER:-dro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dro_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - dro-network

  dro-mongodb:
    image: mongo:7
    container_name: dro-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-dro_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-dro_mongo_pass}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-dro_audit}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - dro_mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - dro-network

  dro-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: dro-api
    restart: unless-stopped
    depends_on:
      dro-postgres:
        condition: service_healthy
      dro-mongodb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://dro-postgres:5432/${POSTGRES_DB:-dro_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-dro_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dro_pass}
      DRO_JWT_SECRET: ${DRO_JWT_SECRET:-dro-local-development-secret-change-this-before-production-2026}
      DRO_JWT_ISSUER: ${DRO_JWT_ISSUER:-digimon-revolution-online}
      DRO_JWT_EXPIRATION_MINUTES: ${DRO_JWT_EXPIRATION_MINUTES:-1440}
      SPRING_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-dro_mongo}:${MONGO_ROOT_PASSWORD:-change-this-mongo-password}@dro-mongodb:27017/${MONGO_DATABASE:-dro_audit}?authSource=admin
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - dro-network

volumes:
  dro_postgres_data:
  dro_mongodb_data:

networks:
  dro-network:
    driver: bridge
