<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0891b2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>DRO — Digimon Revolution Online</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/img/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/img/icon-192.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/game.css" />
</head>

<body>
  <!-- Main content area -->
  <div id="app"></div>

  <!-- Bottom navigation (hidden on login/starter) -->
  <nav id="bottom-nav" class="bottom-nav hidden">
    <div class="bottom-nav-inner">
      <button class="nav-btn" data-route="dashboard" onclick="navigateTo('dashboard')">
        <span class="nav-icon">🏠</span>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-route="missions" onclick="navigateTo('missions')">
        <img class="nav-icon nav-image" src="assets/img/missoes.webp" alt="" />
        <span>Missões</span>
      </button>
      <button class="nav-btn" data-route="inventory" onclick="navigateTo('inventory')">
        <img class="nav-icon nav-image" src="assets/img/mochila.webp" alt="" />
        <span>Mochila</span>
      </button>
      <button class="nav-btn" data-route="shop" onclick="navigateTo('shop')">
        <span class="nav-icon">🛒</span>
        <span>Loja</span>
      </button>
      <button class="nav-btn" data-route="more" onclick="navigateTo('more')">
        <span class="nav-icon">⋯</span>
        <span>Mais</span>
      </button>
    </div>
  </nav>

  <!-- Scripts (order matters) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/starter.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/activity-calendar.js"></script>
  <script src="assets/js/tutorial.js"></script>
  <script src="assets/js/missions.js"></script>
  <script src="assets/js/shop.js"></script>
  <script src="assets/js/inventory.js"></script>
  <script src="assets/js/evolution.js"></script>
  <script src="assets/js/rebirth.js"></script>
  <script src="assets/js/ranking.js"></script>
  <script src="assets/js/incubation.js"></script>
  <script src="assets/js/pokedex.js"></script>
  <script src="assets/js/bosses.js"></script>
  <script src="assets/js/arena.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/clan.js"></script>
  <script src="assets/js/world-boss.js"></script>
  <script src="assets/js/auction-house.js"></script>
  <script src="assets/js/mail.js"></script>
  <script src="assets/js/more.js"></script>
  <script src="assets/js/settings.js"></script>
  <script src="assets/js/router.js"></script>

  <script>
    // Register service worker for PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", setupRouter);
    window.addEventListener("hashchange", setupRouter);
  </script>
</body>
</html>
